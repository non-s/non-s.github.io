[project]
name = "liquid-wire"
version = "3.0.0"
description = "Canal automatizado de YouTube com arte generativa procedural e ambient autoral."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.130.0,<3.0.0",
    "google-auth>=2.29.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "filelock>=3.13.0,<4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# E402 (import fora do topo) so faz sentido onde ha sys.path.insert antes dos imports.
"scripts/*" = ["E402"]
"tests/*" = ["B017", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests que fazem I/O real (upload)",
]

[tool.coverage.run]
# Cobertura inclui utils, scripts e os geradores/upload (thin wrappers que
# delegam para utils mas sao exercitados em CI via dry-run/integracao).
source = ["utils", "scripts", "upload_youtube"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__ == \"__main__\":",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "PIL.*", "requests.*", "cv2", "numpy", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
