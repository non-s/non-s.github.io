[project]
name = "liquid-wire"
version = "1.0.0"
description = "Canal automatizado de YouTube com arte generativa procedural e ambient autoral."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.130.0,<3.0.0",
    "google-auth>=2.29.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "numpy>=2.0.0,<3.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "filelock>=3.13.0,<4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# E402 (import fora do topo) so faz sentido onde ha sys.path.insert antes dos imports.
"scripts/*" = ["E402"]
"tests/*" = ["B017", "F841"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_liquid_wire_composer.py",
    "tests/test_liquid_wire_generator.py",
    "tests/test_liquid_wire_quality.py",
    "tests/test_liquid_wire_quota.py",
    "tests/test_liquid_wire_timeline.py",
    "tests/test_liquid_wire_upload_contract.py",
    "tests/test_flow_field.py",
    "tests/test_particle_system.py",
    "tests/test_fluid_deform.py",
    "tests/test_organic_growth.py",
    "tests/test_post_process.py",
    "tests/test_dsp_oscillators.py",
    "tests/test_dsp_filters.py",
    "tests/test_dsp_envelopes.py",
    "tests/test_dsp_dynamics.py",
    "tests/test_dsp_reverb.py",
    "tests/test_dsp_effects.py",
    "tests/test_perceptual_fingerprint_32.py",
    "tests/test_perceptual_diversity.py",
]
addopts = "-q --strict-markers"
markers = [
    "integration: tests que fazem I/O real (upload)",
]

[tool.coverage.run]
# Cobertura inclui utils, scripts e os geradores/upload (thin wrappers que
# delegam para utils mas sao exercitados em CI via dry-run/integracao).
source = ["utils", "scripts", "upload_youtube"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__ == \"__main__\":",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "PIL.*", "requests.*", "cv2", "numpy"]
ignore_missing_imports = true
follow_imports = "skip"
