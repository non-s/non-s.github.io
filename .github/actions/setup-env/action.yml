name: "Setup Python + FFmpeg + deps"
description: "Checkout, setup-python 3.11 (cache pip), instala FFmpeg (opcional) e dependencias (requirements.txt ou requirements-dev.txt)."

inputs:
  dev:
    description: "Usar requirements-dev.txt em vez de requirements.txt"
    required: false
    default: "false"
  ffmpeg:
    description: "Instalar FFmpeg via apt"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: "Python 3.11"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: "Instalar FFmpeg"
      if: ${{ inputs.ffmpeg == 'true' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg
      shell: bash
    - name: "Instalar dependencias"
      run: |
        pip install --no-cache-dir --upgrade pip
        pip install --no-cache-dir -r ${{ inputs.dev == 'true' && 'requirements-dev.txt' || 'requirements.txt' }}
      shell: bash