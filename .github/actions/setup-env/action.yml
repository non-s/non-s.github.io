name: "Setup Python + FFmpeg + deps"
description: "Setup-python 3.11 (cache pip), instala FFmpeg (opcional) e dependencias (requirements.txt ou requirements-dev.txt). Requer checkout previo do caller."

inputs:
  dev:
    description: "Usar requirements-dev.txt em vez de requirements.txt"
    required: false
    default: "false"
  ffmpeg:
    description: "Instalar FFmpeg via apt"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Python 3.11"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: "Instalar FFmpeg"
      if: ${{ inputs.ffmpeg == 'true' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg
      shell: bash
    - name: "Instalar dependencias"
      run: |
        pip install --no-cache-dir --upgrade pip
        pip install --no-cache-dir -r ${{ inputs.dev == 'true' && 'requirements-dev.txt' || 'requirements.txt' }}
      shell: bash
    - name: "Garantir PYTHONPATH na raiz do repo"
      run: echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
      shell: bash