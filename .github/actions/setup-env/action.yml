name: "Setup Python + FFmpeg + deps"
description: "Setup-python 3.12 (cache pip), instala FFmpeg (opcional) e dependencias travadas. Requer checkout previo do caller."

inputs:
  dev:
    description: "Usar requirements-dev.txt em vez de requirements.txt"
    required: false
    default: "false"
  ffmpeg:
    description: "Instalar FFmpeg via apt"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Python 3.12"
      if: ${{ runner.os != 'Windows' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: "Verificar Python (Windows self-hosted)"
      if: ${{ runner.os == 'Windows' }}
      run: python --version
      shell: powershell
    - name: "Instalar FFmpeg (Linux)"
      if: ${{ inputs.ffmpeg == 'true' && runner.os == 'Linux' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg
      shell: bash
    - name: "Verificar FFmpeg (Windows self-hosted)"
      if: ${{ inputs.ffmpeg == 'true' && runner.os == 'Windows' }}
      run: ffmpeg -version
      shell: powershell
    - name: "Instalar dependencias"
      run: |
        pip install --no-cache-dir --upgrade pip
        # O lockfile inclui runtime e ferramentas de desenvolvimento. Usar
        # sempre a mesma resolução evita que um cron instale versões
        # diferentes daquelas validadas na CI.
        pip install --no-cache-dir -r requirements.lock
      shell: bash
    - name: "Garantir PYTHONPATH na raiz do repo"
      run: echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
      shell: bash
