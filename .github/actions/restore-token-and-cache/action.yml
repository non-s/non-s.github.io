name: "Restaurar token YouTube e caches"
description: "Restaura o token OAuth do YouTube e os caches de b-roll/jazz usados pelos workflows Pata Jazz."

inputs:
  youtube-token:
    description: "Secret YOUTUBE_TOKEN (JSON do token OAuth)"
    required: true
  channel:
    description: "Slug do canal (pata_jazz, pata_lofi, pata_classical). Define o nome do arquivo de token e o prefixo de cache."
    required: false
    default: "pata_jazz"

runs:
  using: "composite"
  steps:
    - name: "Restaurar token YouTube"
      shell: bash
      env:
        YOUTUBE_TOKEN: ${{ inputs.youtube-token }}
        TOKEN_FILENAME: ${{ inputs.channel == 'pata_jazz' && 'youtube_token.json' || format('youtube_token_{0}.json', inputs.channel) }}
      run: |
        umask 077
        if [ -n "$YOUTUBE_TOKEN" ]; then
          printf '%s' "$YOUTUBE_TOKEN" > "$TOKEN_FILENAME"
          chmod 600 "$TOKEN_FILENAME"
        fi
    - name: "Cache b-roll"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: _assets/video/animal_broll
        key: animal-broll-${{ github.run_id }}
        restore-keys: animal-broll-
    - name: "Cache jazz"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: _assets/audio/animal_jazz
        key: animal-jazz-${{ github.run_id }}
        restore-keys: animal-jazz-
    - name: "Cache estado persistente (_data)"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          _data/recent_media.json
          _data/playlist_cache.json
          _data/video_tags.json
          _data/scene_performance.json
          _data/title_pattern_performance.json
          _data/live_viewer_history.json
          _data/live_state.json
        key: ${{ inputs.channel }}-data-${{ github.run_id }}
        restore-keys: ${{ inputs.channel }}-data-