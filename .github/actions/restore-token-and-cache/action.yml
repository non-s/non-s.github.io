name: "Restaurar token YouTube e caches"
description: "Restaura o token OAuth do YouTube e os caches de b-roll/musica usados pelos workflows Pata Jazz."

inputs:
  youtube-token:
    description: "Secret YOUTUBE_TOKEN (JSON do token OAuth)"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Restaurar token YouTube"
      shell: bash
      env:
        YOUTUBE_TOKEN: ${{ inputs.youtube-token }}
      run: |
        umask 077
        if [ -n "$YOUTUBE_TOKEN" ]; then
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json
          chmod 600 youtube_token.json
        fi
    - name: "Cache b-roll"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: _assets/video/animal_broll
        key: animal-broll-${{ github.run_id }}
        restore-keys: animal-broll-
    - name: "Cache musicas"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: _assets/audio/animal_jazz
        key: animal-jazz-${{ github.run_id }}
        restore-keys: animal-jazz-
    - name: "Cache estado persistente (_data)"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _data/recent_media.json
          _data/used_titles.json
          _data/upload_language_counter.json
          _data/playlist_cache.json
          _data/video_tags.json
          _data/scene_performance.json
          _data/title_pattern_performance.json
          _data/quota_usage.json
          _data/view_predictor.json
          _data/viral_signals.json
          _data/publish_slots.json
          _data/last_analytics_video_id.json
          _data/ai_metrics.json
          _data/content_funnel_queue.json
          _data/trending_keywords.json
        key: pata-jazz-data-${{ github.run_id }}
        restore-keys: pata-jazz-data-
    - name: "Cache analytics/dash"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _data/analytics.json
          _data/analytics_history.json
          _dashboard/index.html
          _site/index.html
        key: pata-jazz-analytics-${{ github.run_id }}
        restore-keys: pata-jazz-analytics-
