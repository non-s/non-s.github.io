name: "Restaurar token YouTube e caches"
description: "Restaura o token OAuth do YouTube e os caches de b-roll/jazz usados pelos workflows Pata Jazz."

inputs:
  youtube-token:
    description: "Secret YOUTUBE_TOKEN (JSON do token OAuth)"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Restaurar token YouTube"
      shell: bash
      env:
        YOUTUBE_TOKEN: ${{ inputs.youtube-token }}
      run: |
        umask 077
        if [ -n "$YOUTUBE_TOKEN" ]; then
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json
          chmod 600 youtube_token.json
        fi
    - name: "Cache b-roll"
      uses: actions/cache@v4
      with:
        path: _assets/video/animal_broll
        key: animal-broll-${{ github.run_id }}
        restore-keys: animal-broll-
    - name: "Cache jazz"
      uses: actions/cache@v4
      with:
        path: _assets/audio/animal_jazz
        key: animal-jazz-${{ github.run_id }}
        restore-keys: animal-jazz-
    - name: "Cache estado persistente (_data)"
      # Sem isso, cada workflow (shorts/horizontal/live/batch/weekly/analytics)
      # comeca de um checkout limpo e esses arquivos nunca sobrevivem entre
      # runs - o anti-repeat de b-roll/jazz (recent_media.json), o cache de
      # playlists (playlist_cache.json) e o feedback loop de performance por
      # cena (video_tags.json escrito no upload, scene_performance.json
      # escrito pelo collect_analytics.py e lido de volta por
      # content_strategy.scene_for_mood) ficariam sempre vazios/zerados a
      # cada run, sem nunca dar erro - so silenciosamente nunca funcionando.
      uses: actions/cache@v4
      with:
        path: |
          _data/recent_media.json
          _data/playlist_cache.json
          _data/video_tags.json
          _data/scene_performance.json
        key: pata-jazz-data-${{ github.run_id }}
        restore-keys: pata-jazz-data-