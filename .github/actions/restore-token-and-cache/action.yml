name: "Restaurar token YouTube e estado"
description: "Restaura o token OAuth do YouTube e o estado persistente do canal Liquid Wire."

inputs:
  youtube-token:
    description: "Secret YOUTUBE_TOKEN (JSON do token OAuth)"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Restaurar token YouTube"
      shell: bash
      env:
        YOUTUBE_TOKEN: ${{ inputs.youtube-token }}
      run: |
        umask 077
        if [ -n "$YOUTUBE_TOKEN" ]; then
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json
          chmod 600 youtube_token.json
        fi
    - name: "Cache estado persistente (_data)"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _data/recent_media.json
          _data/used_titles.json
          _data/upload_language_counter.json
          _data/playlist_cache.json
          _data/video_tags.json
          _data/scene_performance.json
          _data/title_pattern_performance.json
          _data/quota_usage.json
          _data/view_predictor.json
          _data/viral_signals.json
          _data/publish_slots.json
          _data/last_analytics_video_id.json
          _data/ai_metrics.json
          _data/content_funnel_queue.json
          _data/agency_daily_brief.json
          _data/agency_memory.json
          _data/competitive_intelligence.json
          _data/story_memory.json
          _data/trending_keywords.json
          _data/live_station_plan.json
          _data/open_research_catalog.json
          _data/generator_history.json
          _data/quality_history.json
          _data/style_drift.json
          _data/catalog_memory.json
          _data/catalog_archive.json
          _data/rejection_memory.json
          _data/canon_state.json
          _data/evolution_state.json
          _data/experiment_ledger.json
          _data/research_state.json
          _data/pipeline_metrics.json
          _data/dead_letter_queue.json
          _data/research_ledger.json
        key: liquid-wire-data-${{ github.run_id }}
        restore-keys: liquid-wire-data-
    - name: "Cache analytics/dash"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _data/analytics.json
          _data/analytics_history.json
          _dashboard/index.html
          _site/index.html
        key: liquid-wire-analytics-${{ github.run_id }}
        restore-keys: liquid-wire-analytics-
