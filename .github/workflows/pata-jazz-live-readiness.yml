name: "Pata Jazz - Live Readiness"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo da verificacao"
        required: false
        default: "pre-flight"

permissions:
  contents: read

jobs:
  live-readiness:
    name: "Verificar YouTube Live sem publicar"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Restaurar token"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Executar pre-flight"
        run: python scripts/check_live_readiness.py
      - name: "Publicar relatorio"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-readiness-${{ github.run_id }}
          path: _data/live_readiness.json
          if-no-files-found: ignore
          retention-days: 30
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
