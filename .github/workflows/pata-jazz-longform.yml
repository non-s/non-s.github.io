name: "Pata Jazz - Compilação Longa (1h)"

on:
  schedule:
    # Toda semana, domingo 04:00 UTC (01:00 BRT) - 1 compilação de 1h
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"
      duration:
        description: "Duração em segundos (3600-36000)"
        required: false
        default: "3600"

permissions:
  contents: read

concurrency:
  group: pata-jazz-longform
  cancel-in-progress: false

env:
  GENERATE_DURATION: ${{ github.event.inputs.duration || '3600' }}

jobs:
  generate-and-upload:
    name: "Gerar e publicar compilação longa Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_LONGFORM_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode live
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar compilação longa"
        run: python generate_pata_jazz_longform.py --duration "$GENERATE_DURATION"
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token.json') != ''
        run: python upload_youtube.py --mode upload --language=en --prefix pata_jazz_longform_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: longform-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json