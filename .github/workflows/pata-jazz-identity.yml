name: "Pata Jazz - Identidade do canal"

on:
  # A marca e estavel; a publicacao so acontece por despacho manual.
  workflow_dispatch:
    inputs:
      apply:
        description: "false = apenas mostra a mudanca; true = publica a identidade canonica"
        required: true
        default: false
        type: boolean
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"
  schedule:
    # 1x por semana (segunda 02:23). Mantém o about/keywords do canal vivos:
    # descrição rotacionada por semana ISO e keywords frescas, para a página
    # não parecer um feed de bot. Custo de quota mínimo (1 list + 1 update).
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: pata-jazz-identity
  cancel-in-progress: false

jobs:
  update-identity:
    name: "Atualizar about/keywords do canal"
    if: ${{ github.event_name == 'workflow_dispatch' && vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_IDENTITY_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode pre-sync
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Atualizar identidade do canal"
        run: python scripts/update_channel_identity.py ${{ inputs.apply == true && '--force' || '--dry-run' }}
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
