name: "Pata Jazz - Checagem de Saude da Live"

on:
  workflow_dispatch:
  schedule:
    # A cada 2h - a live ja reconecta sozinha em falhas curtas (ver
    # scripts/run_live.py); essa checagem so serve pra pegar uma ausencia
    # real e persistente de broadcast "active" no canal.
    - cron: "0 */2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: pata-jazz-live-healthcheck
  cancel-in-progress: true

jobs:
  check:
    name: "Verificar se a live esta realmente ao vivo"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_LIVE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar token YouTube"
        # So o token, sem os caches de b-roll/jazz/_data (essa checagem
        # nao gera nem le nenhum vídeo/asset - so consulta a API).
        shell: bash
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          umask 077
          if [ -n "$YOUTUBE_TOKEN" ]; then
            printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json
            chmod 600 youtube_token.json
          fi
      - name: "Verificar live"
        id: check
        run: python scripts/check_live_health.py
      - name: "Abrir issue se a live estiver fora do ar"
        if: ${{ steps.check.outputs.live_active == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_KNOWN_STATUS: ${{ steps.check.outputs.last_known_status }}
          CHECKED_AT: ${{ steps.check.outputs.checked_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Idempotente: falha silenciosamente se o label ja existir.
          gh label create "live-down" --repo "${{ github.repository }}" \
            --color "d73a4a" --description "Live do Pata Jazz fora do ar" || true
          existing=$(gh issue list --repo "${{ github.repository }}" --label live-down --state open --json number --jq '.[0].number')
          # Timestamp UTC para titulo dinamico (YYYY-MM-DD HH:MM UTC)
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          title="🔴 Live Pata Jazz fora do ar ($ts)"
          body=$(cat <<EOF
          A checagem automática (\`pata-jazz-live-healthcheck.yml\`) não encontrou nenhum broadcast \`active\` no canal.

          - **Run falho:** ${RUN_URL}
          - **Ultima checagem (UTC):** ${CHECKED_AT}
          - **Ultimo status conhecido:** ${LAST_KNOWN_STATUS:- indisponivel}

          **Acao recomendada:**
          1. Verifique o workflow [\`pata-jazz-youtube-live.yml\`](${{ github.server_url }}/${{ github.repository }}/actions/workflows/pata-jazz-youtube-live.yml) e o YouTube Studio.
          2. Para reexecutar manualmente: abra o workflow \`pata-jazz-youtube-live.yml\` e dispare um \`workflow_dispatch\`.

          Esta issue fecha automaticamente quando a checagem encontrar a live de volta.
          EOF
          )
          if [ -z "$existing" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$title" \
              --body "$body" \
              --label live-down
          else
            # Issue ja aberta: adiciona um comentario com a nova deteccao
            # (titulo nao pode ser atualizado dinamicamente sem perder
            # contexto historico, entao so comentamos a nova ocorrencia).
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Deteccao repetida em $ts — run: ${RUN_URL}"
            echo "Issue #$existing ja aberta; adicionado comentario."
          fi
      - name: "Fechar issue se a live estiver de volta"
        if: ${{ steps.check.outputs.live_active == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in $(gh issue list --repo "${{ github.repository }}" --label live-down --state open --json number --jq '.[].number'); do
            gh issue close "$num" --repo "${{ github.repository }}" --comment "Live voltou ao ar - fechando automaticamente."
          done
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
