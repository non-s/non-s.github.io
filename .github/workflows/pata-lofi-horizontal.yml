name: "Pata Lofi - Videos Horizontais"

on:
  schedule:
    # 1 video horizontal por dia - 14:00 BRT (17:00 UTC)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"
      duration:
        description: "Duracao em segundos"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: pata-lofi-horizontal
  cancel-in-progress: false

env:
  GENERATE_DURATION: ${{ github.event.inputs.duration || '300' }}

jobs:
  generate-and-upload:
    name: "Gerar e publicar video horizontal Pata Lofi"
    if: ${{ vars.PATA_LOFI_ENABLED == '1' && vars.PATA_LOFI_HORIZONTAL_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_CHANNEL: pata_lofi
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN_LOFI }}
          channel: pata_lofi
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode live
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar lofi"
        run: python scripts/sync_jazz_music.py || echo "::warning::Lofi sync falhou"
      - name: "Gerar video horizontal"
        run: python generate_pata_jazz_horizontal.py --duration "$GENERATE_DURATION"
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token_lofi.json') != ''
        run: python upload_youtube.py --mode upload --language=en --prefix pata_lofi_horizontal_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lofi-horizontal-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token_lofi.json