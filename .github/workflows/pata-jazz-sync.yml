name: "Pata Jazz - Sync de Conteudo"

on:
  workflow_dispatch:
  schedule:
    # Renova o pool de conteudo 2x por semana (terca e sexta, 06:00 UTC = 03:00 BRT)
    - cron: "0 6 * * 2,5"

permissions:
  contents: read
  # actions: write e necessario para gh cache delete; sem isso, o CLI nao
  # consegue apagar caches antigos via API.
  actions: write

concurrency:
  group: pata-jazz-state
  cancel-in-progress: false

jobs:
  sync:
    name: "Sincronizar b-roll e jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Evict caches antigos (mantem 5 mais recentes por prefixo)"
        # Caches com key=animal-broll-${{ github.run_id }} acumulam a cada run
        # (run_id e unico por execucao). Sem eviction, em ~50 runs hitamos o
        # limite de 10GB do GitHub Actions e novos caches param de ser salvos
        # silenciosamente - o restore-keys cai num cache obsoleto e o job
        # baixa tudo de novo. Este step roda ANTES de criar o cache novo deste
        # run, mantendo so os 5 mais recentes por prefixo.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for prefix in animal-broll- animal-jazz- pata-jazz-data- analytics-; do
            echo "Evictando caches antigos do prefixo '$prefix' (mantem 5 mais recentes)..."
            # gh cache list ordena por createdAt desc por default; pegamos o
            # numero de cada cache e deletamos tudo apos o 5o.
            mapfile -t ids < <(gh cache list --repo "${{ github.repository }}" --key "$prefix*" --order desc --sort created-at --json id --jq '.[].id')
            echo "  Encontrados ${#ids[@]} caches para o prefixo '$prefix'."
            for id in "${ids[@]:5}"; do
              echo "  Deletando cache $id..."
              gh cache delete "$id" --repo "${{ github.repository }}" --yes || true
            done
          done
      - name: "Cache b-roll"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _assets/video/animal_broll
          key: animal-broll-${{ github.run_id }}
          restore-keys: animal-broll-
      - name: "Cache jazz"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _assets/audio/animal_jazz
          key: animal-jazz-${{ github.run_id }}
          restore-keys: animal-jazz-
      - name: "Sincronizar b-roll (gatos/cachorros)"
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/sync_animal_broll.py
      - name: "Sincronizar jazz"
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: python scripts/sync_jazz_music.py
