name: "CI - Pata Jazz"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Testes de sintaxe e unidade"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Instalar FFmpeg"
        # Necessario para tests/test_ffmpeg_integration.py - testes que
        # rodam o FFmpeg de verdade (nao mockado) contra os filtros de
        # utils/video_builder.py. Sem isso, um bug real de escaping que so
        # se manifesta na execucao real do FFmpeg (ex.: font='Arial:style=
        # Bold' sem escape do ':', que quebrou 100% das geracoes de Short
        # em producao) passa pelos testes unitarios (mockados) sem ser
        # pego.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt
      - name: "Lockfile instalavel"
        # Garante que requirements.lock e valido e pode ser instalado. O
        # lockfile e gerado com `make lock` (pip-compile) no ambiente de
        # desenvolvimento; pequenas diferencas entre plataformas (ex:
        # colorama no Windows vs Linux) sao aceitaveis desde que a
        # instalacao e o resto dos checks funcionem.
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.lock
      - name: "Ruff lint"
        run: ruff check .
      - name: "Compile check"
        run: python -m compileall -q .
      - name: "Pytest + coverage"
        run: pytest -q --cov=utils --cov-report=term-missing --cov-fail-under=85
      - name: "Vulnerability audit"
        # Falha o build se pip-audit encontrar CVEs conhecidas nas dependencias
        # declaradas. Mantido limpo em main: qualquer nova CVE exige bump ou
        # --ignore-vuln explicito no proprio PR que a introduz.
        run: pip-audit -r requirements.txt
      - name: "Type check"
        # C1: mypy agora passa limpo em todos os arquivos e e bloqueante.
        # Antes era advisory (|| echo warning) porque faltavam stubs para
        # googleapiclient/Pillow, mas o pyproject.toml ja tem ignore_missing_imports
        # para esses modulos, e o codigo foi tipado completamente.
        run: mypy utils/ scripts/ upload_youtube.py generate_pata_jazz_short.py
      - name: "Security scan"
        # Falha o build em issues de severity MEDIUM+ do bandit (-ll filtra
        # LOW). Falsos-positivos conhecidos levam # nosec no codigo com
        # comentario explicativo, nao supressao global.
        run: bandit -r utils/ scripts/ *.py -ll -q
