name: "CI - Pata Jazz"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Testes de sintaxe e unidade"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt
      - name: "Lockfile sincronizado"
        # Falha o build se requirements.lock estiver desatualizado em relacao a
        # pyproject.toml + requirements-dev.txt. Rodar `make lock` localmente
        # para regenerar apos mudar deps.
        run: |
          pip install --no-cache-dir pip-tools
          pip-compile --dry-run --strip-extras --output-file=/tmp/requirements.lock.check pyproject.toml requirements-dev.txt >/dev/null
          # Ignora as 3 primeiras linhas de cabecalho (timestamp/Python version
          # variam entre runs); o restante e deterministico.
          tail -n +4 /tmp/requirements.lock.check > /tmp/generated.lock
          tail -n +4 requirements.lock > /tmp/committed.lock
          if ! diff -q /tmp/generated.lock /tmp/committed.lock >/dev/null; then
            echo "::error::requirements.lock desatualizado — rode 'make lock' e commite o resultado."
            diff /tmp/generated.lock /tmp/committed.lock || true
            exit 1
          fi
      - name: "Ruff lint"
        run: ruff check .
      - name: "Compile check"
        run: python -m compileall -q .
      - name: "Pytest + coverage"
        run: pytest -q --cov=utils --cov-report=term-missing --cov-fail-under=70
      - name: "Vulnerability audit"
        # Falha o build se pip-audit encontrar CVEs conhecidas nas dependencias
        # declaradas. Mantido limpo em main: qualquer nova CVE exige bump ou
        # --ignore-vuln explicito no proprio PR que a introduz.
        run: pip-audit -r requirements.txt
      - name: "Type check (advisory)"
        # Advisory: mypy em codebase sem stubs para googleapiclient/Pillow tem
        # ruído esperado; nao vale travar PRs por isso enquanto os stubs nao
        # existirem. Mantido limpo em main (utils/, scripts/, geradores e
        # upload_youtube.py); qualquer regressao fica visivel no log.
        run: >
          python -m mypy utils/ scripts/ upload_youtube.py generate_pata_jazz_short.py
          generate_pata_jazz_horizontal.py generate_pata_jazz_live.py
          || echo "::warning::mypy encontrou problemas de tipo"
      - name: "Security scan"
        # Falha o build em issues de severity MEDIUM+ do bandit (-ll filtra
        # LOW). Falsos-positivos conhecidos levam # nosec no codigo com
        # comentario explicativo, nao supressao global.
        run: bandit -r utils/ scripts/ *.py -ll -q
