name: "CI - Pata Jazz"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "Testes de sintaxe e unidade"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: "Ruff lint"
        run: ruff check .
      - name: "Compile check"
        run: python -m compileall -q .
      - name: "Pytest + coverage"
        run: pytest -q --cov=utils --cov-report=term-missing --cov-fail-under=70
      - name: "Vulnerability audit (advisory)"
        # Nao falha o build: uma CVE nova publicada depois nao deveria travar
        # PRs sem relacao nenhuma com a mudanca. Fica visivel no log pra
        # revisao humana decidir quando atualizar.
        run: pip-audit -r requirements.txt || echo "::warning::pip-audit encontrou vulnerabilidades - revisar dependencias"
      - name: "Type check (advisory)"
        # Advisory por enquanto: esta 100% limpo hoje (utils/, scripts/,
        # geradores e upload_youtube.py), mas e a primeira vez que roda em CI -
        # melhor nao travar builds de primeira caso apareca algo inesperado
        # em alguma combinacao de arquivos que eu nao tenha checado localmente.
        run: >
          python -m mypy utils/ scripts/ upload_youtube.py generate_pata_jazz_short.py
          generate_pata_jazz_horizontal.py generate_pata_jazz_live.py
          || echo "::warning::mypy encontrou problemas de tipo"
