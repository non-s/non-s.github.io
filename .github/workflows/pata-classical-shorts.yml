name: "Pata Classical - Shorts"

on:
  schedule:
    # 1 short por hora (24/dia), publica exclusivamente no YouTube.
    # Minuto 7 (nao :00) para nao competir com o pico de cron jobs de
    # outros repos no mesmo minuto (recomendacao do GitHub).
    # (desde jun/2026 videos.insert tem cota propria de ~100/dia, separada
    # do pool de 10k unidades/dia compartilhado pelos outros endpoints - 24
    # uploads/dia usa ~200 unidades/upload do pool compartilhado
    # (thumbnail+captions+playlists) = ~4800/dia, ainda abaixo do limite de
    # 10000 e do alerta em 8000; videos.insert fica bem abaixo dos ~100/dia).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-classical-shorts
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar Short Pata Classical"
    if: ${{ vars.PATA_CLASSICAL_ENABLED == '1' && vars.PATA_CLASSICAL_SHORTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_CHANNEL: pata_classical
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN_CLASSICAL }}
          channel: pata_classical
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode fast
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar Short"
        run: python generate_pata_jazz_short.py
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token_classical.json') != ''
        run: python upload_youtube.py --mode upload --language=en --prefix pata_classical_short_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pata-classical-shorts-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token_classical.json