name: "Pata Jazz - Cross-posting (TikTok/Reels)"

on:
  workflow_run:
    workflows: ["Pata Jazz - Shorts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-jazz-cross-post
  cancel-in-progress: false

jobs:
  cross-post:
    name: "Cross-postar Shorts para TikTok e Instagram Reels"
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIKTOK_EMAIL: ${{ secrets.TIKTOK_EMAIL }}
      TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Instalar navegador do Playwright (TikTok)"
        run: python -m playwright install --with-deps chromium
      - name: "Restaurar sessao do TikTok"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tiktok_state.json
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-
      - name: "Semear sessao do TikTok a partir do secret (1a execucao ou cache expirado)"
        # A conta so loga via QR code/Google (sem senha) - TIKTOK_EMAIL/
        # TIKTOK_PASSWORD nunca vao existir pra essa automacao, entao
        # tiktok_state.json (gerado localmente com
        # scripts/tiktok_login_qr.py e colado no secret TIKTOK_STATE_JSON)
        # e a UNICA forma de autenticar. So escreve se o cache acima nao
        # restaurou nada, pra nunca sobrescrever uma sessao mais recente/
        # renovada por uma run anterior com a copia estatica do secret.
        env:
          TIKTOK_STATE_JSON: ${{ secrets.TIKTOK_STATE_JSON }}
        run: |
          if [ ! -s tiktok_state.json ] && [ -n "$TIKTOK_STATE_JSON" ]; then
            umask 077
            printf '%s' "$TIKTOK_STATE_JSON" > tiktok_state.json
          fi
      - name: "Restaurar cache de videos gerados"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _videos
          key: cross-post-videos-${{ github.run_id }}
          restore-keys: |
            cross-post-videos-
            weekly-videos-
      - name: "Restaurar historico de posts do TikTok"
        # tiktok_posts.json alimenta a secao "Cross-posting TikTok" do
        # dashboard (scripts/generate_dashboard.py) - sem cache aqui, cada
        # run comecaria do zero e o dashboard nunca acumularia historico.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/tiktok_posts.json
          key: tiktok-posts-${{ github.run_id }}
          restore-keys: tiktok-posts-
      - name: "Cross-postar para TikTok"
        # No-op sem tiktok_state.json (sessao) nem TIKTOK_EMAIL/TIKTOK_PASSWORD:
        # upload_tiktok.py loga e retorna 0.
        run: python upload_tiktok.py --all --prefix pata_jazz_short_
      - name: "Cross-postar para Instagram Reels"
        # No-op sem INSTAGRAM_ACCESS_TOKEN: upload_reels.py loga e retorna 0.
        run: python upload_reels.py --all --prefix pata_jazz_short_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-post-output-${{ github.run_id }}
          path: |
            _videos/*.json
            _videos/*.png
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7