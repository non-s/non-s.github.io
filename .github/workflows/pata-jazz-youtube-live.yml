name: "Pata Jazz YouTube Live"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"
      duration_minutes:
        description: "Duracao da transmissao em minutos (0 = ate cancelar)"
        required: false
        default: "350"
      resolution:
        description: "Resolucao da live (720p maximo suportado no runner gratuito)"
        required: false
        default: "1280x720"
        type: choice
        options:
          - "1280x720"
  schedule:
    # Canal sempre ao vivo: cada sessao dura ~350min (LIVE_DURATION_MINUTES),
    # limitado pelo timeout de job do GitHub Actions (nao existe job "eterno").
    # Disparar a cada 6h (360min, > 350) faz o PROXIMO run ser enfileirado
    # (nao cancelado - ver cancel-in-progress abaixo) um pouco antes da
    # sessao atual terminar, entao ele comeca assim que ela acaba, sem
    # esperar ate o proximo horario "redondo". O unico "buraco" real entre
    # uma sessao e outra e o tempo de preparo da proxima (build do loop de
    # clipes + criacao do broadcast), nao um dia inteiro parado como antes.
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pata-jazz-live
  # false (nao cancela): a proxima sessao disparada pelo cron espera a
  # atual terminar naturalmente (transition('complete') + limpeza) em vez
  # de matar a live no meio para comecar uma nova - handoff mais limpo.
  cancel-in-progress: false

env:
  LIVE_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '350' }}
  LIVE_RESOLUTION: ${{ github.event.inputs.resolution || '1280x720' }}

jobs:
  live-stream:
    name: "Transmitir live Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_LIVE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 375
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar FFmpeg"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: "Instalar dependencias"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Executar live Pata Jazz"
        run: python scripts/run_live.py
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
