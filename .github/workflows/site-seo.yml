name: "Site SEO (Multi-canal)"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal para gerar site (pata_jazz, pata_lofi, pata_classical)"
        required: true
        default: "pata_jazz"
        type: choice
        options:
          - "pata_jazz"
          - "pata_lofi"
          - "pata_classical"
  schedule:
    # Apos o analytics semanal (segundas 06:00 UTC) - 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: site-seo-${{ github.event.inputs.channel || 'all' }}
  cancel-in-progress: true

jobs:
  generate-site:
    strategy:
      matrix:
        channel: [pata_jazz, pata_lofi, pata_classical]
      fail-fast: false
    name: "Gerar site estatico SEO - ${{ matrix.channel }}"
    if: ${{ vars[format('{0}_ENABLED', matrix.channel | upper)] == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CHANNEL: ${{ matrix.channel }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar analytics"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            _data/analytics.json
            _data/video_tags.json
            _data/${{ matrix.channel }}/analytics.json
            _data/${{ matrix.channel }}/video_tags.json
          key: analytics-site-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: |
            analytics-site-${{ matrix.channel }}-
            analytics-${{ matrix.channel }}-
            analytics-
      - name: "Gerar site"
        run: python scripts/generate_site.py
      - name: "Upload site como artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ matrix.channel }}
          path: _site/${{ matrix.channel }}/
          retention-days: 30
