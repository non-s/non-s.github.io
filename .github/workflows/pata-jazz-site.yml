name: "Pata Jazz - Site SEO (schema.org)"

on:
  workflow_dispatch:
  schedule:
    # Apos o analytics semanal (segundas 06:00 UTC) - 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pata-jazz-state
  cancel-in-progress: false

jobs:
  generate-site:
    name: "Gerar site estatico SEO"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar analytics (somente leitura)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics.json
            _data/analytics_history.json
          key: pata-jazz-analytics-read-${{ github.run_id }}
          restore-keys: pata-jazz-analytics-
      - name: "Restaurar metadados de conteúdo (somente leitura)"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/video_tags.json
          key: pata-jazz-site-tags-${{ github.run_id }}
          restore-keys: pata-jazz-data-
      - name: "Gerar site"
        run: python scripts/generate_site.py
      - name: "Configurar GitHub Pages"
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: "Empacotar site para GitHub Pages"
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site/
  deploy-site:
    name: "Publicar site SEO"
    needs: generate-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Publicar no GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
