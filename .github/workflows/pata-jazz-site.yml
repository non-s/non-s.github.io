name: "Pata Jazz - Site SEO (schema.org)"

on:
  workflow_dispatch:
  schedule:
    # Apos o analytics semanal (segundas 06:00 UTC) - 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: pata-jazz-site
  cancel-in-progress: true

jobs:
  generate-site:
    name: "Gerar site estatico SEO"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar analytics"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics.json
            _data/video_tags.json
          key: analytics-site-${{ github.run_id }}
          restore-keys: analytics-
      - name: "Gerar site"
        run: python scripts/generate_site.py
      - name: "Upload site como artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pata-jazz-site
          path: _site/
          retention-days: 30