name: "Pata Jazz - Site SEO (schema.org)"

on:
  workflow_dispatch:
  schedule:
    # Apos o analytics semanal (segundas 06:00 UTC) - 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: pata-jazz-site
  cancel-in-progress: true

jobs:
  generate-site:
    name: "Gerar site estatico SEO"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar analytics"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics.json
            _data/video_tags.json
          key: analytics-site-${{ github.run_id }}
          restore-keys: analytics-
      - name: "Gerar site"
        run: python scripts/generate_site.py
      - name: "Upload site como artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pata-jazz-site
          path: _site/
          retention-days: 30