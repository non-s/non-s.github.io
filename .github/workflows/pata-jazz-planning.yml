name: "Pata Jazz - Editorial Planning"

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * 1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Generate 30-day editorial plan"
        run: python scripts/generate_editorial_calendar.py --days 30
      - name: "Publish planning artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pata-jazz-editorial-calendar
          path: _data/editorial_calendar.json
          retention-days: 90
