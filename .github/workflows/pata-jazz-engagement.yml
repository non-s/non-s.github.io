name: "Pata Jazz - Engajamento (Comentarios)"

on:
  schedule:
    # Responde a comentarios 1x/hora (minuto 37, deslocado do cron de Shorts
    # no minuto 7 e do pico de jobs do GitHub no minuto :00). Respostas
    # curtas nao precisam de realtime - a cada hora e o suficiente pra
    # manter o canal "vivo" sem parecer um bot respondendo na mesma hora.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-jazz-engagement
  cancel-in-progress: false

jobs:
  respond-comments:
    name: "Responder comentarios dos videos"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_COMMENTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Restaurar estado de respostas"
        # Sem cache, cada run comecaria do zero e responderia de novo o que
        # ja respondeu (spam de respostas). O estado persiste entre runs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/comments_responded.json
          key: engagement-comments-${{ github.run_id }}
          restore-keys: engagement-comments-
      - name: "Responder comentarios"
        run: python scripts/respond_comments.py
      - name: "Upload artifacts (log de erros)"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engagement-output-${{ github.run_id }}
          path: |
            _videos/last_error.txt
            _data/comments_responded.json
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json