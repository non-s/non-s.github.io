name: "Liquid Wire - Site"

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: liquid-wire-site
  cancel-in-progress: true

jobs:
  build:
    name: "Build static site"
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - run: python scripts/generate_site.py
      - uses: actions/upload-pages-artifact@a18f4b4547d942591169aa6b754a74c71888cfc6 # v4.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@de6c25f8b3d56d5d0fb20a07f8268981ed41c320 # v4.0.5
