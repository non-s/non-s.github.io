name: "Pata Jazz - Agency Council"

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"

permissions:
  contents: read

concurrency:
  group: pata-jazz-agency-council
  cancel-in-progress: true

jobs:
  council:
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Install runtime"
        run: pip install --no-cache-dir -r requirements.txt
      - name: "Restore council memory"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Run daily agency council"
        run: python scripts/run_agency_council.py
      - name: "Publish reviewable brief"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pata-jazz-agency-brief
          path: |
            _data/agency_daily_brief.json
            _data/agency_memory.json
          retention-days: 90
      - name: "Remove token"
        if: always()
        run: rm -f youtube_token.json
