name: Liquid Wire Weekly Batch
on:
  schedule:
    - cron: "30 3 * * 1"  # weekly Monday 03:30 UTC
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: liquid-wire-weekly
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: Publish weekly batch
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python scripts/publish_weekly_batch.py
      - name: Delete token
        if: always()
        run: rm -f youtube_token.json