name: "Pata Lofi - Engajamento (Comentarios)"

on:
  schedule:
    # Responde a comentarios 1x/hora (minuto 37, deslocado do cron de Shorts
    # no minuto 7 e do pico de jobs do GitHub no minuto :00). Respostas
    # curtas nao precisam de realtime - a cada hora e o suficiente pra
    # manter o canal "vivo" sem parecer um bot respondendo na mesma hora.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-lofi-engagement
  cancel-in-progress: false

jobs:
  respond-comments:
    name: "Responder comentarios dos videos Pata Lofi"
    if: ${{ vars.PATA_LOFI_ENABLED == '1' && vars.PATA_LOFI_COMMENTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN_LOFI }}
      - name: "Restaurar estado de respostas"
        # Sem cache, cada run comecaria do zero e responderia de novo o que
        # ja respondeu (spam de respostas). O estado persiste entre runs.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _data/pata_lofi/comments_responded.json
          key: engagement-comments-${{ github.run_id }}
          restore-keys: engagement-comments-
      - name: "Responder comentarios"
        env:
          YOUTUBE_CHANNEL: pata_lofi
        run: python scripts/respond_comments.py
      - name: "Upload artifacts (log de erros)"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pata-lofi-engagement-output-${{ github.run_id }}
          path: |
            _videos/last_error.txt
            _data/pata_lofi/comments_responded.json
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token_lofi.json