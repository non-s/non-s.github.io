name: "Liquid Wire - Live Broadcast"

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Live duration in minutes (5-330)"
        required: false
        default: "330"
      privacy:
        description: "Broadcast privacy"
        required: false
        default: "public"
        type: choice
        options: ["public", "unlisted", "private"]
      continuous:
        description: "Start the next session automatically"
        required: false
        default: true
        type: boolean
      chaos_after_seconds:
        description: "Force one RTMP disconnect for an unlisted recovery test (0 disables)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  broadcast:
    name: "Stream Liquid Wire to YouTube Live"
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YOUTUBE_CHANNEL: liquid_wire
      YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LIQUID_WIRE_SS_FACTOR: "1"
      LIQUID_WIRE_FORCE_PRIVATE: ${{ vars.LIQUID_WIRE_FORCE_PRIVATE || '0' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e estado"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Rebuild append-only publication ledger"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/restore-publication-ledger.sh
      - name: "Validate production credentials"
        run: |
          if [ ! -s youtube_token.json ]; then
            echo "::error::YOUTUBE_TOKEN is missing or empty"
            exit 1
          fi
      - name: "Healthcheck"
        run: python scripts/healthcheck.py
      - name: "Live readiness pre-flight"
        run: python scripts/check_live_readiness.py
      - name: "Generate source video"
        run: |
          # A fresh horizontal audiovisual source is generated for every
          # session.  A compact source minimizes the hand-off gap while FFmpeg
          # repeats it for the full five-and-a-half-hour broadcast.
          python generate_liquid_wire_video.py --preset live-test --duration 30
      - name: "Broadcast to YouTube Live"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          video=$(ls -t _videos/liquid_wire_live-test_*.mp4 2>/dev/null | head -1)
          if [ -z "$video" ]; then
            echo "::error::No source video found in _videos/"
            exit 1
          fi
          duration="${{ inputs.duration_minutes || '330' }}"
          handoff_pid=""
          # Production renders can need multiple quality-gated attempts. Start
          # the next isolated runner one hour early so even a slow fresh render
          # is ready before this broadcast ends.
          if [ "${{ inputs.continuous }}" = "true" ] && [ "$duration" -gt 65 ]; then
            delay_seconds=$((duration * 60 - 3600))
            (
              sleep "$delay_seconds"
              gh workflow run liquid-wire-live.yml --ref main \
                -f duration_minutes=330 -f privacy="${{ inputs.privacy || 'public' }}" \
                -f continuous=true -f chaos_after_seconds=0
              mkdir -p _data
              date -u +%FT%TZ > _data/live_handoff_dispatched
            ) &
            handoff_pid=$!
          fi
          set +e
          python scripts/run_liquid_wire_live.py \
            --video "$video" \
            --duration-minutes "$duration" \
            --privacy "$YOUTUBE_PRIVACY" \
            --max-restarts 10 \
            --chaos-after-seconds "${{ inputs.chaos_after_seconds || '0' }}"
          status=$?
          set -e
          if [ -n "$handoff_pid" ]; then
            kill "$handoff_pid" 2>/dev/null || true
            wait "$handoff_pid" 2>/dev/null || true
          fi
          exit "$status"
      - name: "Chain next continuous session"
        # Handoff is a recovery mechanism too. A broken RTMP connection must
        # start a fresh broadcast immediately instead of waiting for watchdog.
        if: ${{ always() && !cancelled() && inputs.continuous == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active_other=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow liquid-wire-live.yml \
            --limit 20 \
            --json databaseId,status \
            --jq '[.[] | select((.status == "in_progress" or .status == "queued" or .status == "pending") and .databaseId != ${{ github.run_id }})] | length')
          if [ "$active_other" -eq 0 ]; then
            gh workflow run liquid-wire-live.yml --ref main \
              -f duration_minutes=330 -f privacy=${{ inputs.privacy || 'public' }} \
              -f continuous=true -f chaos_after_seconds=0
            echo "Fallback handoff dispatched."
          else
            echo "Overlapping replacement session already active or queued."
          fi
      - name: "Upload live evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquid-wire-live-${{ github.run_id }}
          path: |
            _data/live_readiness.json
            _data/live_continuity.json
            _data/live_handoff_dispatched
            _videos/liquid_wire_live-test_*.json
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
