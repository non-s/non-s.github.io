name: Liquid Wire Engagement
on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch:
jobs:
  engage:
    runs-on: ubuntu-latest
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/restore-token-and-cache
      - name: Respond to comments
        env:
          LIQUID_WIRE_ENABLED: "1"
          LIQUID_WIRE_COMMENTS_ENABLED: "1"
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/respond_comments.py
      - name: Delete token
        if: always()
        run: rm -f youtube_token.json