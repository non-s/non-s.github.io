name: Liquid Wire Engagement
on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: liquid-wire-engagement
  cancel-in-progress: true

jobs:
  engage:
    runs-on: ubuntu-latest
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: Respond to comments
        env:
          LIQUID_WIRE_ENABLED: "1"
          LIQUID_WIRE_COMMENTS_ENABLED: "1"
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/respond_comments.py
      - name: Delete token
        if: always()
        run: rm -f youtube_token.json