name: "Liquid Wire - Aesthetic Evolution"

on:
  schedule:
    # Sunday 02:17 UTC (off-peak) — weekly evolution cycle.
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolve:
    name: "Evolve aesthetic weights from analytics"
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar estado"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Run aesthetic evolution"
        run: python scripts/evolve_aesthetics.py
      - name: "Upload evolution report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evolution-report-${{ github.run_id }}
          path: _data/evolution_report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json