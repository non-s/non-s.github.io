name: "OAuth Token Refresh"

on:
  schedule:
    # #2: 2x por semana (dom e qua as 02:00 UTC) para reduzir risco de
    # expiracao por desuso (90 dias do Google). Rodar 2x garante que mesmo
    # se uma run falhar, a outra renova a tempo.
    - cron: "0 2 * * 0,3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oauth-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: "Renovar token OAuth do YouTube"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ambiente protegido: exige reviewer quando disparado manualmente e
    # limita a superficie de ataque do permissionamento "secrets: write".
    # Para o schedule semanal funcionar sem aprovacao manual, configure uma
    # regra de deployment protection no GitHub que permita "github.event_name
    # == 'schedule'".
    environment: oauth-token-refresh
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.lock
      - name: "Instalar GitHub CLI"
        # gh ja vem pre-instalado no ubuntu-latest; garante versao estavel.
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh nao encontrado no runner"; exit 1
          fi
      - name: "Restaurar token YouTube"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Renovar token e atualizar secret"
        env:
          # Use um fine-grained PAT limitado a este repositorio. O valor do
          # token OAuth e enviado ao gh por stdin, nunca pela linha de comando.
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_oauth_token.py
      - name: "Apagar token local"
        if: always()
        run: rm -f youtube_token.json
