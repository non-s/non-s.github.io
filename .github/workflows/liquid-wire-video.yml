name: "Liquid Wire - Generate and Upload"
run-name: >-
  Liquid Wire [${{ github.event_name == 'schedule' && 'scheduled' || inputs.source }}:${{
  github.event_name == 'schedule' && (github.event.schedule == '37 21 * * 2,4,6' && 'long' || 'short') ||
  inputs.preset }}]${{ inputs.slot && format(' slot={0}', inputs.slot) || '' }}

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Video preset"
        required: true
        default: "short"
        type: choice
        options: ["short", "live-test", "long"]
      duration:
        description: "Optional duration in seconds"
        required: false
        default: ""
      source:
        description: "Dispatch source"
        required: false
        default: "manual"
        type: choice
        options: ["manual", "recovery"]
      slot:
        description: "Recovery slot (UTC hour)"
        required: false
        default: ""
  schedule:
    # Um Short por hora, sempre aos 17 minutos para evitar o pico dos crons.
    - cron: "17 * * * *"
    # Video horizontal ter/qui/sab, 18:17 em Brasilia.
    - cron: "37 21 * * 2,4,6"

permissions:
  contents: read

concurrency:
  group: liquid-wire-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Generate procedural Liquid Wire video"
    if: >-
      ${{ vars.LIQUID_WIRE_ENABLED == '1' &&
      (github.event_name == 'workflow_dispatch' || vars.LIQUID_WIRE_PAUSE_SCHEDULES != '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YOUTUBE_CHANNEL: liquid_wire
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LIQUID_WIRE_SLOT: ${{ inputs.slot }}
      LIQUID_WIRE_KILL_SWITCH: ${{ vars.LIQUID_WIRE_KILL_SWITCH || '0' }}
      LIQUID_WIRE_PUBLICATION_KILL_SWITCH: ${{ vars.LIQUID_WIRE_PUBLICATION_KILL_SWITCH || '0' }}
      LIQUID_WIRE_DISABLE_UPLOAD: ${{ vars.LIQUID_WIRE_DISABLE_UPLOAD || '0' }}
      LIQUID_WIRE_DISABLE_GEMINI: ${{ vars.LIQUID_WIRE_DISABLE_GEMINI || '0' }}
      LIQUID_WIRE_DISABLE_EVOLUTION: ${{ vars.LIQUID_WIRE_DISABLE_EVOLUTION || '0' }}
      LIQUID_WIRE_DISABLE_PUZZLE: ${{ vars.LIQUID_WIRE_DISABLE_PUZZLE || '0' }}
      LIQUID_WIRE_FORCE_PRIVATE: ${{ vars.LIQUID_WIRE_FORCE_PRIVATE || '0' }}
      LIQUID_WIRE_PAUSE_SCHEDULES: ${{ vars.LIQUID_WIRE_PAUSE_SCHEDULES || '0' }}
      LIQUID_WIRE_SAFE_MODE: ${{ vars.LIQUID_WIRE_SAFE_MODE || '0' }}
      LIQUID_WIRE_EVOLUTION_MODE: ${{ vars.LIQUID_WIRE_EVOLUTION_MODE || 'shadow' }}
      # CI runners have only 2 vCPUs; rendering 900 frames at 2x supersample
      # (2160x3840) takes ~15min per attempt, which risks the job timeout.
      # SS=1 renders directly at 1080p (still crisp via Pillow LANCZOS on the
      # wireframe primitives) and cuts render time ~4x, keeping the pipeline
      # safely within the 90min job budget even with quality retries.
      LIQUID_WIRE_SS_FACTOR: "1"
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e estado"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Validate production credentials"
        run: |
          if [ ! -s youtube_token.json ]; then
            echo "::error::YOUTUBE_TOKEN is missing or empty"
            exit 1
          fi
      - name: "Select format"
        id: format
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            preset="${{ inputs.preset }}"
            duration="${{ inputs.duration }}"
          elif [ "${{ github.event.schedule }}" = "37 21 * * 2,4,6" ]; then
            if python scripts/check_long_form_candidate.py; then
              preset="long"
              duration="180"
            else
              echo "No replicated mature Short winner; using another Short experiment."
              preset="short"
              duration=$((27 + ${{ github.run_id }} % 19))
            fi
          else
            preset="short"
            # 27-45 segundos, deterministico por execucao e sempre dentro do limite de Short.
            duration=$((27 + ${{ github.run_id }} % 19))
          fi
          echo "preset=$preset" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
      - name: "Check adaptive publication cadence"
        id: cadence
        run: python scripts/check_publication_cadence.py
      - name: "Healthcheck"
        if: steps.cadence.outputs.generate == 'true'
        run: python scripts/healthcheck.py
        continue-on-error: false
      - name: "Generate procedural video"
        if: steps.cadence.outputs.generate == 'true'
        run: |
          args=(--preset "${{ steps.format.outputs.preset }}" --attempts 3)
          if [ -n "${{ steps.format.outputs.duration }}" ]; then
            args+=(--duration "${{ steps.format.outputs.duration }}")
          fi
          python generate_liquid_wire_video.py "${args[@]}"
      - name: "Upload to YouTube"
        if: steps.cadence.outputs.generate == 'true' && hashFiles('youtube_token.json') != ''
        run: >-
          python upload_youtube.py --mode upload --language=en
          --privacy "$YOUTUBE_PRIVACY"
          --publish-after-check
          --prefix "liquid_wire_${{ steps.format.outputs.preset }}_"
      - name: "Upload production evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquid-wire-evidence-${{ github.run_id }}
          path: |
            _videos/*.json
            _videos/last_error.txt
            _assets/thumbnails/*.jpg
          if-no-files-found: ignore
          retention-days: 30
      - name: "Upload manual debug video"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'manual' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liquid-wire-debug-video-${{ github.run_id }}
          path: _videos/*.mp4
          if-no-files-found: error
          retention-days: 1
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
