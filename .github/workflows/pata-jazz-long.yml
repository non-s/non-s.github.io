name: "Pata Jazz - Long-form (Loop & Relax)"

on:
  schedule:
    # 2 long-forms por semana (A6): domingo 01:13 UTC (sleep/deep) e
    # terca 01:13 UTC (relax/cozy). Dobrar a frequencia dobra o watch
    # time potencial sem custo (mesmo assets, so muda o mood/cena).
    # Minuto 13 evita competir com pico de cron jobs no :00.
    - cron: "13 1 * * 0"
    - cron: "13 1 * * 2"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-jazz-long
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar long-form Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_LONG_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode pre-sync
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar long-form"
        run: |
          cd ${{ github.workspace }}
          # A6: domingo = sleep/deep (15-20min), terca = relax/cozy (10-15min).
          # Moods diferentes capturam publicos diferentes (sono vs relaxamento
          # diurno) sem custo adicional - mesmos assets, so muda a cena.
          DOW=$(date -u +%w)
          if [ "$DOW" = "0" ]; then
            python scripts/generate_pata_jazz_long.py --duration 1200 --scene "sleepy cat"
          else
            python scripts/generate_pata_jazz_long.py --duration 900 --scene "cat relaxing"
          fi
      - name: "Escolher slot de publicação otimizado"
        if: hashFiles('youtube_token.json') != ''
        run: |
          slot=$(python -c "from utils.publish_optimizer import pick_publish_time, iso_datetime_from_slot; print(iso_datetime_from_slot(pick_publish_time(min_delay_hours=6)))")
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          echo "Slot escolhido: $slot"
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token.json') != ''
        run: |
          if [ -n "$SLOT" ]; then
            python upload_youtube.py --mode upload --language=en --publish-at "$SLOT"
          else
            python upload_youtube.py --mode upload --language=en
          fi
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: long-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json