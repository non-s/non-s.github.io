name: "Pata Jazz - Long-form (Loop & Relax)"

on:
  schedule:
    # 1 long-form por semana (domingo 01:13 BRT/UTC, quando a casa ta
    # quieta e o render longo do FFmpeg nao compete com os Shorts de cada
    # hora). Loop & Relax (10min+) compensa a alta frequencia de Shorts com
    # watch time longo e busca de relaxamento - sao poucos mas rendem
    # semanas de session time.
    - cron: "13 1 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-jazz-long
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar long-form Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_LONG_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode fast
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar long-form"
        run: |
          cd ${{ github.workspace }}
          python scripts/generate_pata_jazz_long.py --duration 900
      - name: "Escolher slot de publicação otimizado"
        if: hashFiles('youtube_token.json') != ''
        run: |
          slot=$(python -c "from utils.publish_optimizer import pick_publish_time, iso_datetime_from_slot; print(iso_datetime_from_slot(pick_publish_time(min_delay_hours=6)))")
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          echo "Slot escolhido: $slot"
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token.json') != ''
        run: |
          if [ -n "$SLOT" ]; then
            python upload_youtube.py --mode upload --language=en --publish-at "$SLOT"
          else
            python upload_youtube.py --mode upload --language=en
          fi
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: long-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json