name: "Pata Jazz - Analytics Semanal"

on:
  workflow_dispatch:
  schedule:
    # Toda segundas 06:00 UTC (03:00 BRT) - coleta metricas da semana
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pata-jazz-analytics
  cancel-in-progress: true

jobs:
  analytics:
    name: "Coletar metricas do canal"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      # actions/deploy-pages so publica atraves do ambiente "github-pages" -
      # e o proprio GitHub que cria esse ambiente automaticamente na primeira
      # vez que um workflow com essa permissao roda.
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Restaurar/persistir analytics"
        # Sem isso, _data/analytics*.json e escrito e perdido junto com o
        # runner efemero a cada semana - nada mais no repo le esse arquivo
        # de volta hoje, mas ao menos fica disponivel entre runs para uso
        # futuro (dashboards, feedback loop) em vez de ser sempre descartado.
        # analytics_history.json precisa sobreviver entre runs de verdade
        # (e onde a serie historica se acumula) - so cache resolve isso.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _data/analytics.json
            _data/analytics_history.json
          key: pata_jazz-analytics-${{ github.run_id }}
          restore-keys: pata_jazz-analytics-
      - name: "Coletar analytics"
        run: python scripts/collect_analytics.py
      - name: "Gerar dashboard HTML"
        # So le os JSONs que os steps acima ja escreveram/restauraram - sem
        # rede, sem dependencia nova.
        run: python scripts/generate_dashboard.py
      - name: "Gerar site estatico SEO"
        run: python scripts/generate_site.py
      - name: "Configurar GitHub Pages"
        # Habilita o Pages no repo (build type "workflow") automaticamente
        # na primeira vez, usando a permissao pages:write acima - nao exige
        # configuracao manual previa em Settings > Pages.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: "Upload do dashboard como Pages artifact"
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _dashboard
      - name: "Publicar no GitHub Pages"
        # Repo se chama non-s.github.io, entao isso publica na raiz do
        # dominio (https://non-s.github.io/), nao num subcaminho - so os
        # dados ja publicos no proprio YouTube (views/likes/titulos) e os
        # pesos de performance por cena/padrao de titulo ficam visiveis;
        # nenhum token/segredo passa perto deste job.
        id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: "Upload analytics e dashboard como artifact"
        # O cache acima so serve pra passar o arquivo pro proximo run (nao
        # da pra inspecionar um cache de fora). Como artifact, o relatorio
        # fica baixavel via API/UI - e o que faltava pra esses dados
        # servirem de algo em vez de morrer no runner efemero.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pata-jazz-analytics-report
          path: |
            _data/analytics.json
            _data/analytics_history.json
            _dashboard/index.html
          retention-days: 90
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json