name: "Pata Jazz - Analytics Semanal"

on:
  workflow_dispatch:
  schedule:
    # Toda segundas 06:00 UTC (03:00 BRT) - coleta metricas da semana
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: pata-jazz-analytics
  cancel-in-progress: true

jobs:
  analytics:
    name: "Coletar metricas do canal"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Restaurar/persistir analytics"
        # Sem isso, _data/analytics*.json e escrito e perdido junto com o
        # runner efemero a cada semana - nada mais no repo le esse arquivo
        # de volta hoje, mas ao menos fica disponivel entre runs para uso
        # futuro (dashboards, feedback loop) em vez de ser sempre descartado.
        # analytics_history.json precisa sobreviver entre runs de verdade
        # (e onde a serie historica se acumula) - so cache resolve isso.
        uses: actions/cache@v4
        with:
          path: |
            _data/analytics.json
            _data/analytics_history.json
          key: analytics-${{ github.run_id }}
          restore-keys: analytics-
      - name: "Coletar analytics"
        run: python scripts/collect_analytics.py
      - name: "Gerar dashboard HTML"
        # So le os JSONs que os steps acima ja escreveram/restauraram - sem
        # rede, sem dependencia nova. Ainda nao publicado (GitHub Pages
        # tornaria isso publico na internet, o que exige decisao explicita
        # de quem administra o canal) - por enquanto so vira artifact
        # baixavel, igual ao analytics-report abaixo.
        run: python scripts/generate_dashboard.py
      - name: "Upload analytics e dashboard como artifact"
        # O cache acima so serve pra passar o arquivo pro proximo run (nao
        # da pra inspecionar um cache de fora). Como artifact, o relatorio
        # fica baixavel via API/UI - e o que faltava pra esses dados
        # servirem de algo em vez de morrer no runner efemero.
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: |
            _data/analytics.json
            _data/analytics_history.json
            _dashboard/index.html
          retention-days: 90
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json