name: "Pata Jazz - Lote Semanal"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Etapa: all (gerar+publicar), generate (so gerar), publish (so publicar proximos 6)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - generate
          - publish
  # Sem "schedule": pata-jazz-shorts.yml (4x/dia) e pata-jazz-horizontal.yml
  # (1x/dia) ja cobrem a cadencia diaria pretendida por utils/content_strategy.py.
  # O cron diario que existia aqui ("publish proximos 6") rodava por cima
  # dessas duas, quase triplicando o volume de upload/dia e estourando a
  # quota da API (~1600 unidades/upload x 11 uploads/dia > 10000/dia) - visto
  # em producao como uma sequencia de runs com failure em 24-25/07. Lote
  # semanal agora e uma ferramenta manual (workflow_dispatch) para gerar um
  # lote extra pontualmente, nao um publicador automatico concorrente.

permissions:
  contents: read

concurrency:
  group: pata-jazz-weekly
  cancel-in-progress: false

jobs:
  generate:
    name: "Gerar 35 videos (28 shorts + 7 horizontais)"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && (github.event.inputs.action == 'all' || github.event.inputs.action == 'generate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar FFmpeg"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode live
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar 28 shorts"
        run: |
          for i in $(seq 1 28); do
            echo "=== Gerando short $i/28 ==="
            python generate_pata_jazz_short.py || echo "::warning::Short $i falhou, continuando"
          done
      - name: "Salvar progresso parcial (shorts)"
        # actions/cache@v4 so salva via post-job hook no fim do job - se o
        # job estourar o timeout-minutes durante o loop de horizontais logo
        # abaixo, esse hook nunca roda e os 28 shorts inteiros seriam
        # perdidos. actions/cache/save salva IMEDIATAMENTE aqui, entao os
        # shorts sobrevivem mesmo que o resto do job nao termine. A chave
        # comeca com "weekly-videos-" para continuar batendo com o
        # restore-keys do job publish.
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _videos
          key: weekly-videos-shorts-${{ github.run_id }}
      - name: "Gerar 7 horizontais"
        run: |
          for i in $(seq 1 7); do
            echo "=== Gerando horizontal $i/7 ==="
            python generate_pata_jazz_horizontal.py || echo "::warning::Horizontal $i falhou, continuando"
          done
      - name: "Salvar cache de videos gerados"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _videos
          key: weekly-videos-${{ github.run_id }}
      - name: "Contar videos gerados"
        id: count
        run: |
          shorts=$(ls _videos/pata_jazz_short_*.mp4 2>/dev/null | wc -l)
          horizontals=$(ls _videos/pata_jazz_horizontal_*.mp4 2>/dev/null | wc -l)
          total=$((shorts + horizontals))
          echo "shorts=$shorts" >> $GITHUB_OUTPUT
          echo "horizontals=$horizontals" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "Total gerado: $total (shorts=$shorts, horizontais=$horizontals)"
      - name: "Fazer upload dos primeiros 6 (private)"
        env:
          YOUTUBE_PRIVACY: private
        run: python scripts/publish_weekly_batch.py
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json

  publish:
    name: "Publicar proximos 6 videos (private -> public)"
    needs: [generate]
    # needs.generate.result e 'skipped' quando o job generate nao roda (action=publish);
    # nesse caso o publish deve seguir normalmente. Quando action=all, aguarda
    # o generate terminar antes de publicar (evita rodar em paralelo e nao
    # encontrar o cache de videos ainda nao salvo).
    if: |
      !cancelled() &&
      vars.PATA_JAZZ_ENABLED == '1' &&
      (needs.generate.result == 'success' || needs.generate.result == 'skipped') &&
      (github.event.inputs.action == 'all' || github.event.inputs.action == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar dependencias"
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Restaurar cache de videos gerados"
        # Chave com run_id (nao estatica): cache e imutavel - uma chave
        # estatica "weekly-videos" travaria para sempre nos videos da primeira
        # execucao, ignorando os gerados depois. Com run_id restauramos via
        # restore-keys o cache mais recente que ainda nao foi "finalizado"
        # (cache hit na chave exata) e salvamos um novo a cada run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _videos
          key: weekly-videos-publish-${{ github.run_id }}
          restore-keys: weekly-videos-
      - name: "Publicar proximos 6 videos"
        env:
          YOUTUBE_PRIVACY: public
        run: python scripts/publish_weekly_batch.py
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json