name: "Pata Jazz - Lote Semanal"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Etapa: all (gerar+publicar), generate (so gerar), publish (so publicar proximos 6)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - generate
          - publish
  # Sem "schedule": pata-jazz-shorts.yml (1 short/hora, 24/dia) ja cobre a
  # cadencia diaria pretendida por utils/content_strategy.py. O cron diario
  # que existia aqui ("publish proximos 6") rodava por cima dela, quase
  # triplicando o volume de upload/dia e estourando a quota da API (~1600
  # unidades/upload x 11 uploads/dia > 10000/dia) - visto em producao como
  # uma sequencia de runs com failure em 24-25/07. Com o cron horario ja
  # usando boa parte da quota do pool compartilhado (~4800/10000 unidades/dia,
  # ver comentario em pata-jazz-shorts.yml), rodar o lote semanal no mesmo
  # dia do cron horario deixa pouca margem - confira scripts/collect_analytics
  # /quota_usage.json antes de disparar manualmente. Lote semanal agora e
  # uma ferramenta manual (workflow_dispatch) para gerar um lote extra
  # pontualmente, nao um publicador automatico concorrente.

permissions:
  contents: read

concurrency:
  group: pata-jazz-weekly
  cancel-in-progress: false

jobs:
  generate:
    name: "Gerar 35 shorts"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && (github.event.inputs.action == 'all' || github.event.inputs.action == 'generate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # workflow_dispatch manual: geracao massiva de conteudo + upload.
    # Requer ambiente protegido com reviewer obrigatorio.
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode pre-sync
      - name: "Sincronizar b-roll"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar 35 shorts"
        run: |
          for i in $(seq 1 35); do
            echo "=== Gerando short $i/35 ==="
            python generate_pata_jazz_short.py || echo "::warning::Short $i falhou, continuando"
          done
      - name: "Salvar cache de videos gerados"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _videos
          key: weekly-videos-${{ github.run_id }}
      - name: "Contar videos gerados"
        id: count
        run: |
          prefix="pata_jazz_short_"
          shorts=$(ls _videos/${prefix}*.mp4 2>/dev/null | wc -l)
          echo "shorts=$shorts" >> $GITHUB_OUTPUT
          echo "total=$shorts" >> $GITHUB_OUTPUT
          echo "Total gerado: $shorts shorts"
      - name: "Fazer upload dos primeiros 6 (private)"
        env:
          YOUTUBE_PRIVACY: private
        run: python scripts/publish_weekly_batch.py
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json

  publish:
    name: "Publicar proximos 6 videos (private -> public)"
    needs: [generate]
    # needs.generate.result e 'skipped' quando o job generate nao roda (action=publish);
    # nesse caso o publish deve seguir normalmente. Quando action=all, aguarda
    # o generate terminar antes de publicar (evita rodar em paralelo e nao
    # encontrar o cache de videos ainda nao salvo).
    if: |
      !cancelled() &&
      vars.PATA_JAZZ_ENABLED == '1' &&
      (needs.generate.result == 'success' || needs.generate.result == 'skipped') &&
      (github.event.inputs.action == 'all' || github.event.inputs.action == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # workflow_dispatch manual: publicacao em massa que consome quota.
    # Requer ambiente protegido com reviewer obrigatorio.
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Restaurar cache de videos gerados"
        # Chave com run_id (nao estatica): cache e imutavel - uma chave
        # estatica "weekly-videos" travaria para sempre nos videos da primeira
        # execucao, ignorando os gerados depois. Com run_id restauramos via
        # restore-keys o cache mais recente que ainda nao foi "finalizado"
        # (cache hit na chave exata) e salvamos um novo a cada run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _videos
          key: weekly-videos-publish-${{ github.run_id }}
          restore-keys: weekly-videos-
      - name: "Publicar proximos 6 videos"
        env:
          YOUTUBE_PRIVACY: public
        run: python scripts/publish_weekly_batch.py
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json