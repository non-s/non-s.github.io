name: "Cleanup YouTube"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = so lista candidatos (nao deleta); false = deleta de verdade"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cleanup-youtube
  cancel-in-progress: false

jobs:
  cleanup:
    name: "Remover videos legados (horizontal/live) do canal"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_dispatch manual: acao destrutiva (deleta videos do canal
    # quando dry_run=false). Requer ambiente protegido com reviewer obrigatorio.
    environment: production
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
        with:
          ffmpeg: "false"
      - name: "Restaurar token"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Rodar limpeza"
        id: cleanup
        run: python scripts/cleanup_youtube.py --dry-run "${DRY_RUN}"
      - name: "Resumo"
        if: always()
        run: |
          echo "### Cleanup YouTube" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry_run: ${{ steps.cleanup.outputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidatos encontrados: ${{ steps.cleanup.outputs.candidates }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deletados: ${{ steps.cleanup.outputs.deleted }}" >> "$GITHUB_STEP_SUMMARY"
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
