name: Liquid Wire Identity
on:
  schedule:
    - cron: "20 3 * * 1"  # weekly Monday 03:20 UTC
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: liquid-wire-identity
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    if: ${{ vars.LIQUID_WIRE_ENABLED == '1' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: Update channel identity
        env:
          LIQUID_WIRE_ENABLED: "1"
          LIQUID_WIRE_IDENTITY_ENABLED: "1"
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_channel_identity.py
      - name: Delete token
        if: always()
        run: rm -f youtube_token.json