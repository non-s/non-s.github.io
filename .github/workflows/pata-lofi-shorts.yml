name: "Pata Lofi - Shorts"

on:
  schedule:
    # 2 shorts por dia (cadencia menor que Jazz para nao saturar): 12:00, 20:00 BRT
    # = 15:00, 23:00 UTC
    - cron: "0 15,23 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-lofi-shorts
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar Short Pata Lofi"
    if: ${{ vars.PATA_LOFI_ENABLED == '1' && vars.PATA_LOFI_SHORTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_CHANNEL: pata_lofi
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN_LOFI }}
          channel: pata_lofi
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode live
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar lofi"
        run: python scripts/sync_jazz_music.py || echo "::warning::Lofi sync falhou"
      - name: "Gerar Short"
        run: python generate_pata_jazz_short.py
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token_lofi.json') != ''
        run: python upload_youtube.py --mode upload --language=en --prefix pata_lofi_short_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lofi-shorts-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token_lofi.json