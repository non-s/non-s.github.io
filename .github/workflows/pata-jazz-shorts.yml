name: "Pata Jazz - Shorts"

on:
  schedule:
    # 4 shorts por dia: 07:00, 13:00, 18:00, 22:00 BRT (UTC-3)
    # = 10:00, 16:00, 21:00, 01:00 UTC
    # Razao: YouTube API permite 6 uploads/dia (10k unidades / 1600 por upload)
    # 4 shorts + 1 horizontal = 5 uploads/dia, dentro do limite com folga
    - cron: "0 10,16,21,1 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: pata-jazz-shorts
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar Short Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_SHORTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: "Instalar FFmpeg"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: "Instalar dependencias"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar Short"
        run: python generate_pata_jazz_short.py
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token.json') != ''
        run: python upload_youtube.py --mode upload --language=pt --prefix pata_jazz_short_
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
