name: "Pata Jazz - Shorts"

on:
  schedule:
    # Um Short por dia cria um sinal editorial consistente sem inundar inscritos
    # nem dividir a pouca audiência inicial entre vídeos quase idênticos. Aumentos
    # de cadência só devem ocorrer depois que os dados de retenção justificarem.
    # 18:07 UTC evita o pico de crons em :00 e fica próximo ao fim da tarde no
    # Brasil, mantendo alcance para a Europa no começo da noite.
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  # Todos os jobs que fazem read-modify-write em _data compartilham o mesmo
  # grupo. filelock protege processos no mesmo runner; este grupo protege
  # snapshots de cache entre runners diferentes.
  group: pata-jazz-state
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: "Gerar e publicar Short Pata Jazz"
    if: ${{ vars.PATA_JAZZ_ENABLED == '1' && vars.PATA_JAZZ_SHORTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup"
        uses: ./.github/actions/setup-env
      - name: "Restaurar token e caches"
        uses: ./.github/actions/restore-token-and-cache
        with:
          youtube-token: ${{ secrets.YOUTUBE_TOKEN }}
      - name: "Healthcheck (pre-flight)"
        run: python scripts/healthcheck.py --mode pre-sync
      - name: "Sincronizar b-roll (gatos/cachorros)"
        run: python scripts/sync_animal_broll.py || echo "::warning::B-roll sync falhou"
      - name: "Sincronizar jazz"
        run: python scripts/sync_jazz_music.py || echo "::warning::Jazz sync falhou"
      - name: "Gerar Short"
        run: python generate_pata_jazz_short.py
      - name: "Escolher slot de publicação otimizado"
        if: hashFiles('youtube_token.json') != ''
        # So agenda via --publish-at quando houver dados de performance
        # suficientes (publish_slots.json com amostras). Canal novo sem
        # dados: publica imediatamente para acumular views/inscritos.
        run: |
          slot=""
          if [ -f "_data/publish_slots.json" ]; then
            samples=$(python -c "import json; d=json.load(open('_data/publish_slots.json')); print(sum(s.get('samples',0) for s in d.values() if isinstance(s, dict)))" 2>/dev/null || echo "0")
            if [ "$samples" -ge 10 ]; then
              slot=$(python -c "from utils.publish_optimizer import pick_publish_time, iso_datetime_from_slot; print(iso_datetime_from_slot(pick_publish_time()))" 2>/dev/null || echo "")
            fi
          fi
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          echo "Slot escolhido: ${slot:-publicacao-imediata}"
      - name: "Upload para YouTube"
        if: hashFiles('youtube_token.json') != ''
        run: |
          if [ -n "$SLOT" ]; then
            python upload_youtube.py --mode upload --language=en --publish-at "$SLOT"
          else
            python upload_youtube.py --mode upload --language=en
          fi
      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shorts-output-${{ github.run_id }}
          path: |
            _videos/*.mp4
            _videos/*.json
            _videos/*.srt
            _videos/last_error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Apagar token"
        if: always()
        run: rm -f youtube_token.json
