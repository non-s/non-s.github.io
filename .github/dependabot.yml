version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Agrupa updates de runtime (requirements.txt) num unico PR por semana
      # em vez de N PRs soltos (um por dependencia transitive).
      pip-runtime:
        patterns:
          - "google-api-python-client"
          - "google-auth"
          - "google-auth-oauthlib"
          - "requests"
          - "Pillow"
          - "filelock"
      # Dependencias de dev/test (requirements-dev.txt) num PR separado do
      # runtime - atualizar pytest/ruff/mypy nao deve misturar com mudancas
      # que afetam requirements.txt em producao.
      pip-dev:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "pytest-xdist"
          - "ruff"
          - "pip-audit"
          - "mypy"
          - "types-requests"
          - "bandit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Todas as actions (checkout, setup-python, cache, etc) num so PR -
      # sao tipicamente minor versions de actions mantidas pelo GitHub e
      # raramente quebram compatibilidade entre si.
      actions:
        patterns:
          - "actions/*"
          - "softprops/*"
  # A action composta tambem executa codigo no runner e precisa receber os
  # mesmos updates de seguranca das actions declaradas nos workflows.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-env"
    schedule:
      interval: "weekly"
